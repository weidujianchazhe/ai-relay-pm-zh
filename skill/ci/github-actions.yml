name: 管理区门禁

# ============================================================
# 本包的门禁都是**确定性函数 + 退出码**，可直接接进任何 CI。
#   0 = 全通过 · 1 = 有[问题]（应阻断） · 2 = 仅[待核]（建议不阻断） · 3 = 脚本自身错误（应阻断）
# 依赖：仅 Python 3 标准库（无第三方、无编译）。
#
# 纪律（与 references/code-quality.md §1.2 同源）：
#   **工具只配拦截线**——不要在这里另写一套阈值；阈值一律取自实例 MAP 规则段。
# ============================================================

on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # 与工作区声明一致；本包不需要任何 pip 依赖

      #  -B：以下每一步都以 -B 调用——顶层解释器 import _common 也会写 __pycache__，
      #      只有 -B 能挡住；包内不留字节码是明示口径，见 scripts/README.md。
      #      （这不是放宽判定：**gen_views §15 仍会把 __pycache__ 判为残留** —— 2026-10-16 更正，
      #       原文「已不判」与实现不符；`-B` 的作用是运行时不留下字节码，不是关掉该判据。）
      # ── 先证明门禁是活的，再拿它判别人 ──
      # 一个永远返回 0 的脚本，和一条被删掉的检查，从输出上看不出区别。
      - name: 门禁变异自检
        run: python -B scripts/selftest_gates.py

      # ── 入口成本预算：技能包自身 SKILL.md 字符数；阈值取自 config/defaults.yml ──
      #   （这条检查自己是可被证伪的：把 skill_max_chars 调小，它必须 exit=1）
      - name: 入口成本预算
        run: python -B scripts/check_size_budget.py .

      # ── 结构模式规则（Correctness 域阻断层）：能指向具体缺陷位置，不是数值比较 ──
      #  ★ 2026-10-16 外部审查修：原先 `continue-on-error: true` 让这条**被称为阻断层**的门禁
      #  实际上**从不阻断**工作流（名不副实）。但也不能简单删掉——本脚本的**正常**退出码是 2
      #  （「仅观察项，不阻断」，见 scripts/README.md 退出码四值），删掉会让绿构建变红。
      #  正解：**只把真阻断(1)与脚本自身错误(3)当失败**；0/2 视为通过。
      - name: 结构模式规则（rc=1/3 才失败；rc=2 为观察层，不阻断）
        run: |
          set +e
          python -B scripts/correctness_rules.py .
          rc=$?
          #  ★ 2026-10-16 第三次外部审查修：判据改成**白名单**（只认 0/2 通过）。
          #  原写法「非 1/3 即通过」会把**未知退出码**（4、5、被信号打断后的码）也当成功。
          if [ "$rc" = "0" ] || [ "$rc" = "2" ]; then
            echo "结构模式规则 rc=$rc（0=无观察项 / 2=仅观察项，按约定不阻断）"
          else
            echo "::error::结构模式规则返回 $rc（1=规则阻断 / 3=脚本自身错误 / 其他=未预期退出码）"
            exit "$rc"
          fi

      # ── 全盘核查：编排全部门禁 + 以机器戳留痕 + 超期自查 ──
      #  ★ 2026-10-16 外部审查修：原写法 `audit_all.py .` 把**技能包仓库**当工作区 ——
      #  而 audit_all 需要 MAP.md / REVIEWS.md / INDEX.md 等**工作区文件**（本仓库没有），
      #  ⇒ 在 CI 上**必然报红**（假红），且与它要验证的「编排是否正常」无关。
      #  正解：先用 templates/ **实例化一个最小工作区**，再在上面跑编排器 —— 这既是真实用法，
      #  也顺带验证了模板与初始化口径（模板缺失会在这里暴露）。
      - name: 全盘核查（在模板实例化的最小工作区上跑；rc=1/3 才失败）
        run: |
          #  ★ 2026-10-16 第二次外部审查修（P1 退出语义冲突）：
          #  上一版在 `set -e` 下直接跑 `audit_all.py`，而**最小工作区**上它正常返回 **2**
          #  （多个成员为「待核」）——`set -e` 会把「仅待核、不阻断」判成 CI 失败，与模板自己的声明矛盾。
          #  正解：**建工作区阶段保留 -e**（建失败要停），**跑编排器前 set +e** 并只把 1/3 当失败。
          set -e
          WS=$(mktemp -d)/ws
          mkdir -p "$WS"/{tasks,reports,archives/done,designs,scripts,src}
          cp templates/MAP.template.md "$WS/MAP.md"
          cp templates/STATE.template.md "$WS/STATE.md"
          cp templates/REVIEWS.template.md "$WS/REVIEWS.md"
          cp templates/INDEX.template.md "$WS/INDEX.md"
          cp templates/archives/INDEX_ARCHIVED.template.md "$WS/archives/INDEX_archived.md"
          cp SKILL.md "$WS/SKILL.md"
          set +e
          python -B scripts/audit_all.py "$WS"
          rc=$?
          #  ★ 同上：白名单只认 0/2 为通过，未知退出码必须失败（否则"没见过的码"会被静默放过）。
          if [ "$rc" = "0" ] || [ "$rc" = "2" ]; then
            echo "全盘核查 rc=$rc（0=全通过 / 2=仅待核，按约定不阻断）"
          else
            echo "::error::全盘核查返回 $rc（1=有[问题] / 3=脚本自身错误 / 其他=未预期退出码）"
            exit "$rc"
          fi

      # ── 代码度量与依赖方向（有源码时；SOURCE_ROOT 设为仓库变量）──
      # 分层与依赖例外在**实例 MAP 规则段**声明，不写在这里：
      #   - **分层**：ui > agent > core > llm > config > utils
      #   - **依赖例外**：ui.main_window->ui.mw_parts
      - name: 代码度量与依赖方向
        if: ${{ vars.SOURCE_ROOT != '' }}
        #  ★ 2026-10-16 外部审查 #5 复核：`--ws=.`(仓库根) 是【有意】的正确用法，不要改成最小工作区 ——
        #    code_metrics 用 `--ws` 当 root 算 `p.relative_to(root)`（见该脚本 L596 实测注释），
        #    若指向不含源码的最小工作区会直接 rc=3（已实测）。仓库根同时含 scripts/ 与 config/defaults.yml，
        #    阈值回落到 defaults 也是【有意】的：CI 度量的是【包自己】，不是某个项目。
        run: python -B scripts/code_metrics.py "${{ vars.SOURCE_ROOT }}" --ws=.

      # ── 退出码：0 全通过 · 1 有[问题]＝阻断 · 3 脚本错误＝阻断 · **2 仅[待核]：本样板未实现其不阻断语义，接入方请自行处理** ──
      #   （原样板只写注释没实现；本轮选择**如实声明**而非加实现——样板价值不值得改 4 个步骤的动作。）
      - name: 退出码语义
        if: always()
        run: echo "0 全通过 · 1 有[问题] · 2 仅[待核] · 3 脚本错误"
